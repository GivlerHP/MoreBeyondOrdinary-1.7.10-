task verifyTextureInterpolationStandalone(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath.filter {
        !it.name.startsWith('angelica-') && !it.name.startsWith('gtnhlib-') && !it.name.startsWith('AAunimixins-')
    }
    main = 'ru.givler.mbo.client.texture.TextureInterpolationSmoke'
}

apply from: 'gradle/verifyNativeResources.gradle'

tasks.check.dependsOn(
