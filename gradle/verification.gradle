task verifyProductionTransformers(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'ru.givler.mbo.core.ProductionTransformersSmoke'
    args new File(gradle.gradleUserHomeDir, 'caches/minecraft/net/minecraftforge/forge/1.7.10-10.13.4.1614-1.7.10/srgs').absolutePath
    if (project.hasProperty('coloredLightOptifineJar')) {
        classpath += files(project.property('coloredLightOptifineJar'))
        args project.property('coloredLightOptifineJar'), project.property('coloredLightMinecraftJar')
    }
    if (project.hasProperty('productionAuditExtraJars')) classpath += files(project.property('productionAuditExtraJars').toString().split(';'))
}

task verifyWaterloggedStorage(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'ru.givler.mbo.waterlogging.WaterloggedStorageSmoke'
    doLast {
        javaexec {
            classpath = sourceSets.test.runtimeClasspath
            main = 'ru.givler.mbo.waterlogging.WaterloggedSupportSmoke'
            if(project.hasProperty('waterloggedExtraJars'))
                classpath += files(project.property('waterloggedExtraJars').toString().split(';'))
        }
    }
}

