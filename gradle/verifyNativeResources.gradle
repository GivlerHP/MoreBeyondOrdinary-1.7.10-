// Optional real-OpenGL resource lifecycle checks; no game window is opened.
task extractNativeResourceTestLibraries(type: Sync) {
    from {
        configurations.testRuntimeClasspath.findAll {
            it.name.startsWith('lwjgl-platform-') && it.name.endsWith('-natives-windows.jar')
        }.collect { zipTree(it) }
    }
    include '**/*.dll'
    into "$buildDir/native-resource-test-libraries"
}
task verifyNativeResources(type: JavaExec) {
    group = 'verification'
    dependsOn testClasses, extractNativeResourceTestLibraries
    classpath = sourceSets.test.runtimeClasspath
    main = 'ru.givler.mbo.client.render.NativeResourceLifecycleSmoke'
    doFirst {
        jvmArgs = jvmArgs.findAll { !it.startsWith('-Djava.library.path=') }
        systemProperty 'java.library.path', file("$buildDir/native-resource-test-libraries").absolutePath
    }
}
